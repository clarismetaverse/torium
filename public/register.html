<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3efe7">
  <title>TORIUM · Richiedi invito</title>
  <style>
    :root{--bg:#f3efe7;--card:#fffdf8;--ink:#171713;--muted:#716d64;--line:#ded5c6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#dce9d5,transparent 34%),var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    main{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:clamp(26px,6vw,44px);box-shadow:0 28px 80px #2e35231a}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#52704b;font-weight:800}
    h1{margin:18px 0 9px;font-family:Georgia,serif;font-size:44px;line-height:.95;letter-spacing:-.045em;font-weight:400}
    p{color:var(--muted);line-height:1.55;margin:0 0 28px}
    label{display:grid;gap:7px;margin-top:15px;font-size:12px;font-weight:700}
    input{border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px 14px;font:inherit;color:inherit}
    button{width:100%;margin-top:22px;border:0;border-radius:13px;background:#171713;color:#fff;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    .status{min-height:20px;margin-top:14px;color:#38513c;font-size:12px;line-height:1.45}
    .small{font-size:11px;margin-top:20px;color:#38513c}
    .small a{color:#38513c}
    .back{display:block;margin-top:18px;color:#38513c;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">TORIUM Investor Club</div>
    <h1>Richiedi accesso.</h1>
    <p>Inserisci la tua mail e ti invieremo un invito. Se l’indirizzo è valido, riceverai le istruzioni per impostare la password e attivare l’accesso.</p>
    <form id="registerForm">
      <label>Email<input id="email" name="email" type="email" autocomplete="email" required></label>
      <button id="submit" type="submit">Invia richiesta</button>
      <div id="status" class="status" role="status"></div>
    </form>
    <div class="small">Nessun account esistente: risposta generica per evitare di confermare indirizzi di utenti.</div>
    <a class="back" href="/login">Torna all’accesso</a>
  </main>
  <script src="/register.js"></script>
</body>
</html>
