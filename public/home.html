<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TORIUM · Run Intelligence</title>
  <style>
    :root{--bg:#f4f1ea;--panel:#fffaf0;--card:#fff;--ink:#171717;--muted:#716b61;--line:#dfd5c5;--chip:#eee4d3;--accent:#111}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    .shell{max-width:1440px;margin:0 auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.brand h1{margin:0;font-size:30px;letter-spacing:-.045em}.brand p{margin:6px 0 0;color:var(--muted)}
    .toolbar{display:grid;grid-template-columns:minmax(280px,1.4fr) minmax(250px,1fr) minmax(130px,.55fr) auto auto auto;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:16px}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}.field select,.field input,button{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;font:inherit}.toolbar button{width:auto;cursor:pointer;background:var(--accent);color:#fff;border-color:var(--accent)}.toolbar button.secondary{background:#fff;color:var(--ink)}.toolbar button:disabled{cursor:wait;opacity:.6}.run-status{min-height:20px;margin:-7px 2px 14px;font-size:13px;color:var(--muted)}.run-status.success{color:#165b36}.run-status.error{color:#9c2f22}
    .runmeta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.chip{display:inline-flex;align-items:center;border-radius:999px;background:var(--chip);padding:6px 9px;font-size:12px}.chip.strategy-neutral{background:#dff3e7;color:#165b36}.chip.strategy-legacy{background:#f8dfd7;color:#7a2d1c}.chip.strategy-combined{background:#e6e2ff;color:#40338a}.muted{color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 30px #0000000a}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.stat b{font-size:25px;letter-spacing:-.04em}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.panel-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head h2{margin:0;font-size:17px}.list{display:grid}.deal{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}.deal:last-child{border-bottom:0}.deal:hover{background:#fffaf3}.rank{font-weight:700;font-size:18px}.deal h3{margin:0 0 6px;font-size:14px}.deal-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}.deal-meta{display:flex;gap:6px;flex-wrap:wrap}.deal-score{text-align:right}.deal-score b{display:block;font-size:20px}.deal-score span{font-size:11px;color:var(--muted)}
    .finance-box{margin-top:12px;border:1px solid #eadfcd;background:#fbf7ef;border-radius:16px;padding:12px}.finance-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.finance-head b{font-size:13px}.finance-head span{font-size:11px;color:var(--muted)}.finance-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.finance-metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px}.finance-metric span{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.finance-metric b{font-size:14px}.finance-metric.strong b{font-size:16px}.finance-note{margin-top:8px;font-size:10px;color:var(--muted);line-height:1.35}
    .explain{padding:16px}.explain h3{margin:0 0 8px}.explain p{color:var(--muted);line-height:1.5;font-size:14px}.formula{background:#f9f4ea;border:1px solid #eadfcd;border-radius:14px;padding:12px;margin:12px 0;font-size:13px;line-height:1.5}.empty{padding:40px;text-align:center;color:var(--muted)}
    @media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr auto}}
    @media(max-width:700px){.shell{padding:16px}.top{display:block}.toolbar{grid-template-columns:1fr}.toolbar button{width:100%}.stats{grid-template-columns:repeat(2,1fr)}.deal{grid-template-columns:36px minmax(0,1fr)}.deal-score{text-align:left}.deal-top{grid-template-columns:1fr}.finance-grid{grid-template-columns:repeat(2,1fr)}.brand h1{font-size:26px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="top"><div class="brand"><h1>TORIUM</h1><p>Run intelligence · scouting & fractionability dashboard</p></div><div class="muted" id="updated"></div></div>

    <section class="toolbar">
      <div class="field"><label for="runSelect">Run selezionata</label><select id="runSelect"></select></div>
      <div class="field"><label for="criterion">Ordina per</label><select id="criterion">
        <option value="torium">TORIUM Door Score</option>
        <option value="balanced">Miglior compromesso · fisico + ROI</option>
        <option value="roiBase">ROI base</option>
        <option value="profitBase">Profit / Loss base</option>
        <option value="roiLow">ROI low case</option>
        <option value="max45">Max Doors · 45 mq/unità</option>
        <option value="conservative55">Conservativo · 55 mq/unità</option>
        <option value="aggressive40">Aggressivo · 40 mq/unità</option>
        <option value="bathrooms">Bagni-aware · superficie + bagni</option>
        <option value="spread">Opportunity · prezzo/mq + frazionabilità</option>
      </select></div>
      <button id="newNeutralRun">Avvia run seria · Milano</button>
      <button id="valueRun">Ricalcola valuation & ROI</button>
      <button id="refresh" class="secondary">Ricarica dati</button>
    </section>
    <div id="runStatus" class="run-status"></div>

    <div id="runMeta" class="runmeta"></div>
    <section id="stats" class="stats"></section>

    <div class="layout">
      <section class="panel">
        <div class="panel-head"><h2>Deal ranking</h2><span class="muted" id="rankingLabel"></span></div>
        <div id="deals" class="list"><div class="empty">Caricamento…</div></div>
      </section>
      <aside class="panel">
        <div class="panel-head"><h2>Logica criterio</h2></div>
        <div id="criterionExplain" class="explain"></div>
      </aside>
    </div>
  </div>
<script>
const state={outputs:[],output:null,outputId:null,criterion:new URLSearchParams(location.search).get('sort')||'torium'};
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat('it-IT');
const money=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
const n=v=>v===null||v===undefined||v===''?null:(Number.isFinite(Number(v))?Number(v):null);
const fmt=v=>n(v)!==null?nf.format(n(v)):'—';
const eur=v=>n(v)!==null?money.format(n(v)):'—';
const pct=v=>n(v)!==null?`${n(v).toFixed(1)}%`:'—';
const listing=r=>r?.listing||r||{};
const results=o=>arr(o?.results).length?o.results:arr(o?.result_links);
const title=r=>r?.title||listing(r)?.suggestedTexts?.title||listing(r)?.title||'Immobile';
const area=r=>listing(r)?.listing_area||listing(r)?.area_label||listing(r)?.neighborhood||listing(r)?.district||r?.listing_area||r?.area||r?.query_area||'Milano';
const size=r=>n(listing(r)?.size??r?.size_mq);
const baths=r=>n(listing(r)?.bathrooms??r?.bathrooms);
const priceM2=r=>n(listing(r)?.priceByArea??r?.price_by_area);
const price=r=>n(listing(r)?.price??r?.price_eur??r?.price);
const backendUnits=r=>n(r?.door_engine?.estimatedFinalUnits??r?.estimated_final_units);
const doorScore=r=>n(r?.ranking_score??r?.score??r?.door_engine?.doorScore??r?.door_score)??0;
const idOf=(r,i)=>String(r?.id??r?.listing_index??i);
const strategyLabel=v=>v==='neutral_fractionability'?'Neutral · solo frazionabilità':v==='legacy_low_price_m2'?'Legacy · prezzo/mq':v==='combined_neutral_legacy'?'Neutral + Legacy · ricalcolata':'Strategia non registrata';
const strategyClass=v=>v==='neutral_fractionability'?'strategy-neutral':v==='legacy_low_price_m2'?'strategy-legacy':v==='combined_neutral_legacy'?'strategy-combined':'';
const originLabel=r=>{const values=arr(r?.origin_search_strategies).map(strategyLabel);return values.length?values.join(' + '):''};

const criteria={
  torium:{label:'TORIUM Door Score',description:'Usa il ranking TORIUM già calcolato dalla pipeline: superficie, unità potenziali, bagni, planimetria, segnali di ristrutturazione, prezzo/mq e red flags.',formula:'Score backend 0–100. È il criterio più completo e aderente alla pipeline.'},
  balanced:{label:'Miglior compromesso',description:'Combina la frazionabilità fisica con il ROI base, mantenendo visibili i due componenti.',formula:'70% Physical Door Score + 30% ROI normalizzato. Il ROI viene normalizzato da −25% a +25% su scala 0–100. È una vista frontend e non riscrive la run.'},
  roiBase:{label:'ROI base',description:'Ordina per rendimento percentuale nello scenario base.',formula:'ROI base = (exit base − costo progetto) ÷ costo progetto × 100. Gli immobili senza valuation vanno in fondo.'},
  profitBase:{label:'Profit / Loss base',description:'Ordina per utile o perdita nominale nello scenario base.',formula:'P/L base = exit base − costo progetto. Gli immobili senza valuation vanno in fondo.'},
  roiLow:{label:'ROI low case',description:'Ordina per rendimento nello scenario di uscita prudente.',formula:'ROI low = (exit low − costo progetto) ÷ costo progetto × 100. Gli immobili senza valuation vanno in fondo.'},
  max45:{label:'Max Doors · 45 mq/unità',description:'Massimizza il numero teorico di unità ricavabili dalla superficie complessiva.',formula:'unità = floor(superficie / 45 mq). Ranking prima per unità, poi per Door Score.'},
  conservative55:{label:'Conservativo · 55 mq/unità',description:'Stima più prudente: richiede più superficie media per ogni nuova unità.',formula:'unità = floor(superficie / 55 mq). Utile per layout meno aggressivi e tagli più vendibili.'},
  aggressive40:{label:'Aggressivo · 40 mq/unità',description:'Scenario massimizzazione porte con taglio medio più piccolo.',formula:'unità = floor(superficie / 40 mq). Da considerare come scenario upper-bound, non come fattibilità tecnica.'},
  bathrooms:{label:'Bagni-aware',description:'Vincola la stima per evitare che grandi superfici con pochissimi bagni risultino artificialmente prime.',formula:'unità = min(floor(superficie / 45), bagni + 1). Ranking per unità vincolate e Door Score.'},
  spread:{label:'Opportunity · prezzo/mq + frazionabilità',description:'Premia immobili grandi, frazionabili e relativamente economici al mq.',formula:'opportunity = unità45 × 20 + Door Score − prezzo/mq ÷ 250. È un indice comparativo, non un ROI.'}
};
criteria.roiBase.formula='ROI base = (exit base − costo progetto − costo vendita) ÷ (costo progetto + costo vendita) × 100. Il costo vendita è il 3% dell’exit; gli immobili senza frazionamento vanno in fondo.';
criteria.profitBase.formula='P/L base = exit base − costo progetto − costo vendita. Il costo vendita è il 3% dell’exit; gli immobili senza frazionamento vanno in fondo.';
criteria.roiLow.formula='ROI low = (exit low − costo progetto − costo vendita) ÷ (costo progetto + costo vendita) × 100. Gli immobili senza frazionamento vanno in fondo.';
if(!criteria[state.criterion])state.criterion='torium';$('criterion').value=state.criterion;
function calc(r){const s=size(r)||0,b=baths(r)||0,ds=doorScore(r),ppm=priceM2(r)||99999,f=finance(r);const u45=Math.max(1,Math.floor(s/45)),units=backendUnits(r)||u45;if(state.criterion==='torium')return{rank:ds,display:ds,units,label:'TORIUM score',format:'number'};if(state.criterion==='balanced'){const normalizedRoi=f.roi===null?0:Math.max(0,Math.min(100,(f.roi+25)*2));const value=(ds*.7)+(normalizedRoi*.3);return{rank:f.roi===null?Number.NEGATIVE_INFINITY:value,display:value,units,label:'score combinato',format:'number'}}if(state.criterion==='roiBase')return{rank:f.roi??Number.NEGATIVE_INFINITY,display:f.roi,units,label:'ROI base',format:'percent'};if(state.criterion==='profitBase')return{rank:f.profitBase??Number.NEGATIVE_INFINITY,display:f.profitBase,units,label:'P/L base',format:'money'};if(state.criterion==='roiLow')return{rank:f.roiLow??Number.NEGATIVE_INFINITY,display:f.roiLow,units,label:'ROI low',format:'percent'};if(state.criterion==='max45')return{rank:u45*100+ds,display:u45,units:u45,label:'unità stimate',format:'number'};if(state.criterion==='conservative55'){const u=Math.max(1,Math.floor(s/55));return{rank:u*100+ds,display:u,units:u,label:'unità stimate',format:'number'}}if(state.criterion==='aggressive40'){const u=Math.max(1,Math.floor(s/40));return{rank:u*100+ds,display:u,units:u,label:'unità stimate',format:'number'}}if(state.criterion==='bathrooms'){const u=Math.max(1,Math.min(u45,b+1));return{rank:u*100+ds,display:u,units:u,label:'unità stimate',format:'number'}}const opp=(u45*20)+ds-(ppm/250);return{rank:opp,display:opp,units:u45,label:'opportunity',format:'number'}}
function ranked(){return results(state.output).map((r,i)=>({r,i,c:calc(r)})).sort((a,b)=>(b.c.rank-a.c.rank)||(doorScore(b.r)-doorScore(a.r))||(a.i-b.i))}
function outputLabel(o){const date=o.modified_at?new Date(o.modified_at):null;const d=date&&!Number.isNaN(date.getTime())?date.toLocaleString('it-IT'):'—';return `${o.search_name||'run'} · ${strategyLabel(o.search_strategy)} · ${o.city||''} · ${d}`}

function finance(r){
  const u=r?.underwriting||{},c=u.costs||{},low=u.scenarios?.low||{},base=u.scenarios?.base||{},high=u.scenarios?.high||{};
  return {p:n(c.purchasePriceEur),purchaseCosts:n(c.purchaseCostsEur),transformation:n(c.transformationCostEur),projectCost:n(c.projectCostEur),saleLow:n(low.exitValueEur),saleBase:n(base.exitValueEur),saleHigh:n(high.exitValueEur),sellingLow:n(low.sellingCostEur),sellingBase:n(base.sellingCostEur),sellingHigh:n(high.sellingCostEur),totalLow:n(low.totalCostEur),totalBase:n(base.totalCostEur),totalHigh:n(high.totalCostEur),profitLow:n(low.profitLossEur),profitBase:n(base.profitLossEur),profitHigh:n(high.profitLossEur),roiLow:n(low.roiPct),roi:n(base.roiPct),roiHigh:n(high.roiPct),status:u.status,rate:n(u.assumptions?.purchaseCostRate),sellingRate:n(u.assumptions?.sellingCostRate),costPerUnit:n(u.assumptions?.costPerNewUnitEur),newUnits:n(c.newUnitsCreated)};
}
function valuationSummary(r){const a=r?.gpt_analysis?.valuation_assumptions||{},s=a.scenario_multipliers||{};if(!r?.gpt_analysis?.valuation_profile_version||r?.gpt_analysis?.valuation_applicability==='not_applicable_no_fractioning')return'';const factors=arr(a.unit_size_multipliers),factor=n(a.unit_size_multiplier)!==null?n(a.unit_size_multiplier).toFixed(2):factors.length?'per singola unità':'—';return `Exit ${r.gpt_analysis.valuation_profile_version}: benchmark ${eur(a.benchmark_eur_mq)}/mq × fattore taglio ${factor}; superficie vendibile ${pct(n(a.saleable_area_ratio)*100)}; scenari ${pct(n(s.low)*100)} / ${pct(n(s.base)*100)} / ${pct(n(s.high)*100)}.`}
function financeCard(r){const f=finance(r),a=r?.gpt_analysis||{},hasRevenue=f.saleLow!==null||f.saleBase!==null||f.saleHigh!==null,valuation=valuationSummary(r),notApplicable=a.valuation_applicability==='not_applicable_no_fractioning',origin=originLabel(r);const rate=f.sellingRate!==null?pct(f.sellingRate*100):'3%';return `<div class="finance-box"><div class="finance-head"><b>Costi stimati & ROI</b><span>${origin?`origine ${h(origin)} · `:''}costi ${h(r?.underwriting?.version||'')} ${valuation?'· exit deterministico':''}</span></div><div class="finance-grid"><div class="finance-metric"><span>Acquisto</span><b>${eur(f.p)}</b></div><div class="finance-metric"><span>Costi acquisto (${f.rate!==null?pct(f.rate*100):'—'})</span><b>${eur(f.purchaseCosts)}</b></div><div class="finance-metric"><span>Trasformazione (${fmt(f.newUnits)} nuove unità)</span><b>${eur(f.transformation)}</b></div><div class="finance-metric strong"><span>Costo progetto</span><b>${eur(f.projectCost)}</b></div><div class="finance-metric"><span>Exit low</span><b>${eur(f.saleLow)}</b></div><div class="finance-metric"><span>Vendita low (${rate})</span><b>${eur(f.sellingLow)}</b></div><div class="finance-metric"><span>Exit base</span><b>${eur(f.saleBase)}</b></div><div class="finance-metric"><span>Vendita base (${rate})</span><b>${eur(f.sellingBase)}</b></div><div class="finance-metric"><span>Exit high</span><b>${eur(f.saleHigh)}</b></div><div class="finance-metric"><span>Vendita high (${rate})</span><b>${eur(f.sellingHigh)}</b></div><div class="finance-metric strong"><span>Costo totale base</span><b>${eur(f.totalBase)}</b></div><div class="finance-metric strong"><span>ROI base</span><b>${pct(f.roi)}</b></div><div class="finance-metric"><span>P/L low · ROI ${pct(f.roiLow)}</span><b>${eur(f.profitLow)}</b></div><div class="finance-metric strong"><span>P/L base · ROI ${pct(f.roi)}</span><b>${eur(f.profitBase)}</b></div><div class="finance-metric"><span>P/L high · ROI ${pct(f.roiHigh)}</span><b>${eur(f.profitHigh)}</b></div></div><div class="finance-note">${valuation?h(valuation)+' ':''}${notApplicable?'ROI frazionamento non applicabile: il progetto non crea nuove unità.':hasRevenue?`Costo vendita = exit × ${rate}. Costo totale = costo progetto + costo vendita. P/L = exit − costo totale; ROI = P/L ÷ costo totale × 100.`:'ROI non calcolabile: questa run non contiene ancora una valuation di uscita.'} Nessuna contingency o holding inclusa. Valori preliminari.</div></div>`}

async function loadOutputs(){const res=await fetch('/api/outputs?t='+Date.now());const data=await res.json();state.outputs=data.outputs||[];$('runSelect').innerHTML=state.outputs.map(o=>`<option value="${h(o.id)}">${h(outputLabel(o))}</option>`).join('');const requested=new URLSearchParams(location.search).get('run');const selected=requested?state.outputs.find(o=>o.id===requested||o.id===`supabase:${requested.replace(/^supabase:/,'')}`):null;if(selected||state.outputs[0])await loadRun((selected||state.outputs[0]).id)}
function syncRunUrl(id){const url=new URL(location.href);url.searchParams.set('run',id);url.searchParams.set('sort',state.criterion);history.replaceState(null,'',url.pathname+url.search)}
function valuationTarget(id){const value=String(id||'');if(value.startsWith('supabase:'))return{runId:value.replace(/^supabase:/,''),label:'run selezionata'};if(value.startsWith('combined:')){const components=value.replace(/^combined:/,'').split('+').filter(Boolean);const neutral=components.find(component=>component.includes('neutral_fractionability'));if(neutral)return{runId:neutral,label:'componente neutral della vista combinata'}}return null}
async function loadRun(id){const res=await fetch('/api/output?file='+encodeURIComponent(id)+'&t='+Date.now());const out=await res.json();if(!res.ok)throw new Error(out.error||'Run load failed');state.output=out;state.outputId=id;$('runSelect').value=id;syncRunUrl(id);draw()}
async function startNeutralRun(){
  if(!confirm('Avviare una run neutral seria su tutta Milano? Verranno richiesti fino a 200 annunci da almeno 100 mq e verranno usati crediti Apify.'))return;
  const button=$('newNeutralRun'),status=$('runStatus'),started=Date.now();
  button.disabled=true;status.className='run-status';
  const timer=setInterval(()=>{status.textContent=`Run seria Milano in corso... ${Math.floor((Date.now()-started)/1000)}s`;},1000);
  try{
    const res=await fetch('/api/run-triage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strategy:'neutral_fractionability',profile:'milano_broad'})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Avvio run fallito');
    status.className='run-status success';status.textContent=`Run completata: ${data.eligible_count} immobili idonei. Carico i risultati...`;
    await loadOutputs();
  }catch(error){status.className='run-status error';status.textContent=error.message}
  finally{clearInterval(timer);button.disabled=false}
}
async function startValuation(){
  const target=valuationTarget(state.outputId);
  if(!target){alert('Questa vista non contiene una run Supabase aggiornabile.');return}
  if(!confirm(`Calcolare valuation deterministica low/base/high e ROI per tutti i deal idonei della ${target.label}?`))return;
  const button=$('valueRun'),status=$('runStatus'),started=Date.now(),runId=target.runId,selectedOutputId=state.outputId;
  button.disabled=true;status.className='run-status';
  const timer=setInterval(()=>{status.textContent=`Valuation in corso... ${Math.floor((Date.now()-started)/1000)}s`;},1000);
  try{
    const res=await fetch('/api/run-valuation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:runId,limit:20,mode:'deterministic'})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Valuation fallita');
    status.className='run-status success';status.textContent=`Valuation deterministica completata: ${data.valued_count} immobili. ROI aggiornati.`;
    await loadRun(selectedOutputId);
  }catch(error){status.className='run-status error';status.textContent=error.message}
  finally{clearInterval(timer);button.disabled=false}
}
async function refreshData(){const button=$('refresh'),status=$('runStatus');button.disabled=true;status.className='run-status';status.textContent='Ricarico i dati salvati...';try{await loadOutputs();status.className='run-status success';status.textContent=`Dati ricaricati alle ${new Date().toLocaleTimeString('it-IT')}.`}catch(error){status.className='run-status error';status.textContent=error.message}finally{button.disabled=false}}
function draw(){drawMeta();drawStats();drawRanking();drawExplain()}
function drawMeta(){const o=state.output||{};const source=arr(o.source_channels).join(', ')||'—';const areas=arr(o.requested_areas);$('runMeta').innerHTML=`<span class="chip">${h(o.search_name||'triage')}</span><span class="chip ${strategyClass(o.search_strategy)}">${h(strategyLabel(o.search_strategy))}</span><span class="chip">scoring: ${h(o.scoring_mode||'legacy/non registrato')}</span><span class="chip">${h(o.city||'')}</span><span class="chip">source: ${h(source)}</span>${areas.length?`<span class="chip">${areas.length} aree</span>`:''}<span class="chip">profile: ${h(o.investor_profile||'—')}</span>`;$('updated').textContent='Run: '+String(state.outputId||'').replace(/^supabase:/,'')}
function drawStats(){const o=state.output||{},rs=results(o),rank=ranked(),roi=o.roi_statistics||{};const avg=rs.length?rs.reduce((a,r)=>a+doorScore(r),0)/rs.length:null;const unitTotal=rank.reduce((a,x)=>a+(x.c.units||0),0);const values=[['Scraped',o.scraped_count??o.raw_source_count,'number'],['Eligible',o.eligible_count,'number'],['Deal visibili',rs.length,'number'],['Score medio',avg!==null?avg.toFixed(1):null,'number'],['Unità stimate',unitTotal,'number'],['Deal con valuation',roi.valuedCount,'number'],['ROI base mediano',roi.medianBaseRoiPct,'percent'],['ROI base medio',roi.averageBaseRoiPct,'percent']];if(o.merge_summary)values.push(['Duplicati rimossi',o.merge_summary.duplicates_removed,'number']);$('stats').innerHTML=values.map(([k,v,type])=>`<div class="stat"><span>${h(k)}</span><b>${type==='percent'?pct(v):fmt(v)}</b></div>`).join('')}
function drawRanking(){const rankedRows=ranked();$('rankingLabel').textContent=criteria[state.criterion].label;$('deals').innerHTML=rankedRows.length?rankedRows.slice(0,60).map((x,rank)=>{const r=x.r,l=listing(r);const link=new URL('/property/'+encodeURIComponent(idOf(r,x.i)),location.origin);link.searchParams.set('run',state.outputId);link.searchParams.set('sort',state.criterion);const mainValue=x.c.format==='percent'?pct(x.c.display):x.c.format==='money'?eur(x.c.display):fmt(x.c.display);return `<a class="deal" href="${h(link.pathname+link.search)}"><div class="rank">${rank+1}</div><div><div class="deal-top"><div><h3>${h(title(r))}</h3><div class="deal-meta"><span class="chip">${h(area(r))}</span><span class="chip">${fmt(size(r))} mq</span><span class="chip">${eur(price(r))}</span><span class="chip">${priceM2(r)?fmt(priceM2(r))+' €/mq':'—'}</span><span class="chip">${baths(r)??'—'} bagni</span><span class="chip">Door ${fmt(doorScore(r))}</span></div></div><div class="deal-score"><b>${mainValue}</b><span>${h(x.c.label)}</span></div></div>${financeCard(r)}</div></a>`}).join(''):'<div class="empty">Nessun risultato disponibile per questa run.</div>'}
function drawExplain(){const c=criteria[state.criterion];const neutral=state.output?.search_strategy==='neutral_fractionability'&&state.criterion==='torium';const description=neutral?'Usa il Physical Fractionability Score della run neutral: superficie, unità potenziali, bagni, planimetria, ingressi ed esposizione. Prezzo/mq e segnali economici non modificano il ranking.':c.description;const formula=neutral?'Physical Fractionability Score 0–100. A parità di score non viene applicato alcuno spareggio sul prezzo/mq.':c.formula;$('criterionExplain').innerHTML=`<h3>${h(c.label)}</h3><p>${h(description)}</p><div class="formula">${h(formula)}</div><p>Il menu modifica il ranking e la stima mostrata nella homepage; non riscrive i risultati persistiti della run né sostituisce la verifica tecnica della planimetria.</p>`}
$('runSelect').onchange=e=>loadRun(e.target.value).catch(err=>$('deals').innerHTML=`<div class="empty">${h(err.message)}</div>`);
$('criterion').onchange=e=>{state.criterion=e.target.value;const url=new URL(location.href);url.searchParams.set('sort',state.criterion);history.replaceState(null,'',url.pathname+url.search);draw()};
$('refresh').onclick=refreshData;
$('newNeutralRun').onclick=startNeutralRun;
$('valueRun').onclick=startValuation;
loadOutputs().catch(err=>$('deals').innerHTML=`<div class="empty">${h(err.message)}</div>`);
</script>
</body>
</html>
