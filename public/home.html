  it:{subtitle:'Run intelligence · dashboard scouting e frazionabilità',runSelected:'Run selezionata',sortBy:'Ordina per',neighborhood:'Quartiere',allNeighborhoods:'Tutti i quartieri',portalPresence:'Presenza portali',allPortals:'Tutti gli annunci',sharedPortals:'Condivisi tra i portali',idealistaOnly:'Solo Idealista',immobiliareOnly:'Solo Immobiliare.it',sharedListings:'Annunci condivisi',sharedShare:'del perimetro',sharedTag:'Idealista + Immobiliare.it',sharedSignalNote:'Presente su entrambi i portali: possibile segnale di maggiore esposizione o negoziabilità, da verificare.',neighborhoodCoverage:'Copertura quartieri',detailedNeighborhoods:'quartieri dettagliati',macroAreas:'macro-zone',ranking:'Classifica operazioni',criterionLogic:'Logica criterio',loading:'Caricamento…',empty:'Nessun risultato disponibile per questa run.',areas:'aree',profile:'profilo',source:'fonte',scoring:'scoring',run:'Run',scraped:'Raccolti',eligible:'Idonei',visibleDeals:'Deal visibili',dataReviewCount:'Dati da verificare',averageScore:'Score medio',estimatedUnits:'Unità stimate',valuedDeals:'Deal con valuation',medianBaseRoi:'ROI base mediano',averageBaseRoi:'ROI base medio',duplicates:'Duplicati rimossi',bathrooms:'bagni',unitsLabel:'unità stimate',combinedScore:'score combinato',toriumScore:'TORIUM score',costsRoi:'Costi stimati & ROI',origin:'origine',costs:'costi',deterministicExit:'exit deterministico',purchase:'Acquisto',purchaseCosts:'Costi acquisto',transformation:'Trasformazione',newUnits:'nuove unità',projectCost:'Costo progetto',sale:'Vendita',totalBaseCost:'Costo totale base',noFractionRoi:'ROI frazionamento non applicabile: il progetto non crea nuove unità.',missingRoi:'ROI non calcolabile: questa run non contiene ancora una valuation di uscita.',preliminary:'Nessuna contingency o holding inclusa. Valori preliminari.',menuNote:'Il menu modifica il ranking e la stima mostrata nella homepage; non riscrive i risultati persistiti della run né sostituisce la verifica tecnica dell };

function drawStats(){const o=state.output||{},rs=filteredResults(),rank=ranked(),scope=results(state.output).filter(r=>state.neighborhood==='all'||neighborhoodKey(r)===state.neighborhood),sharedCount=scope.filter(r=>portalPresence(r).shared).length,sharedPercent=scope.length?(sharedCount/scope.length)*100:null;const avg=rs.length?rs.reduce((a,r)=>a+doorScore(r),0)/rs.length:null;const unitTotal=rank.reduce((a,x)=>a+(x.c.units||0),0),qualityReview=rs.filter(r=>!dataQuality(r).valid).length,roiValues=rs.filter(r=>dataQuality(r).valid).map(r=>finance(r).roi).filter(value=>value!==null).sort((a,b)=>a-b),roiAverage=roiValues.length?roiValues.reduce((sum,value)=>sum+value,0)/roiValues.length:null,roiMedian=roiValues.length?(roiValues.length%2?roiValues[(roiValues.length-1)/2]:(roiValues[roiValues.length/2-1]+roiValues[roiValues.length/2])/2):null;const values=[[t('scraped'),o.scraped_count??o.raw_source_count,'number'],[t('eligible'),o.eligible_count,'number'],[t('visibleDeals'),rs.length,'number'],[t('sharedListings'),sharedCount,'number',sharedPercent!==null?`${pct(sharedPercent)} ${t('sharedShare')}`:''],[t('dataReviewCount'),qualityReview,'number'],[t('averageScore'),avg!==null?avg.toFixed(1):null,'number'],[t('estimatedUnits'),unitTotal,'number'],[t('valuedDeals'),roiValues.length,'number']];const priceSummary=o.price_comparison_summary;if(priceSummary)values.push([state.lang==='it'?'Prezzi diversi tra portali':'Different cross-portal prices',priceSummary.different_price_property_count,'number']);if(roiMedian!==null&&roiMedian>=0)values.push([t('medianBaseRoi'),roiMedian,'percent']);if(roiAverage!==null&&roiAverage>=0)values.push([t('averageBaseRoi'),roiAverage,'percent']);if(o.merge_summary)values.push([t('duplicates'),o.merge_summary.duplicates_removed,'number']);$('stats').innerHTML=values.map(([k,v,type,note])=>`<div class="stat"${k===t('sharedListings')?` title="${h(t('sharedSignalNote'))}"`:''}><span>${h(k)}</span><b>${type==='percent'?pct(v):fmt(v)}</b>${note?`<small>${h(note)}</small>`:''}</div>`).join('')}
function drawNeighborhoodCoverage(){const rows=neighborhoodRows(),all=portalFilteredResults(),macroCount=new Set(all.map(macroArea).filter(Boolean).map(value=>value.toLocaleLowerCase('it-IT'))).size,max=rows[0]?.count||1;const subtitle=`${fmt(rows.length)} ${t('detailedNeighborhoods')} · ${fmt(macroCount)} ${t('macroAreas')} · ${fmt(all.length)} deal`;const distribution=rows.map(row=>`<div class="coverage-row" title="${h(row.name)}: ${fmt(row.count)}"><span class="coverage-name">${h(row.name)}</span><span class="coverage-track"><span class="coverage-bar" style="width:${Math.max(3,(row.count/max)*100).toFixed(1)}%"></span></span><b class="coverage-count">${fmt(row.count)}</b></div>`).join('');$('neighborhoodCoverage').innerHTML=`<div class="coverage-head"><div><h2>${h(t('neighborhoodCoverage'))}</h2><p>${h(subtitle)}</p></div>${state.neighborhood!=='all'?`<span class="chip area-primary">${h(rows.find(row=>row.key===state.neighborhood)?.name||state.neighborhood)}</span>`:''}</div><div class="coverage-list">${distribution||`<div class="muted">${h(t('empty'))}</div>`}</div>`}
function drawRanking(){const rankedRows=ranked(),visibleRows=rankedRows.slice(0,state.visibleLimit);$('rankingLabel').textContent=`${criteria()[state.criterion].label} · ${fmt(visibleRows.length)}/${fmt(rankedRows.length)}`;$('deals').innerHTML=visibleRows.length?visibleRows.map((x,rank)=>{const r=x.r,l=listing(r);const link=new URL('/property/'+encodeURIComponent(idOf(r,x.i)),location.origin);link.searchParams.set('run',state.outputId);link.searchParams.set('sort',state.criterion);if(state.neighborhood!=='all')link.searchParams.set('neighborhood',state.neighborhood);if(state.portal!=='all')link.searchParams.set('portal',state.portal);const mainValue=x.c.format==='percent'?pct(x.c.display):x.c.format==='money'?eur(x.c.display):fmt(x.c.display),reasons=qualityReasons(r),secondary=areaSecondary(r);const signals=`${portalPresence(r).shared?`<span class="chip signal-shared" title="${h(t('sharedSignalNote'))}">${h(t('sharedTag'))}</span>`:''}${!dataQuality(r).valid?`<span class="chip signal-data-quality" title="${h(reasons.join(' · '))}">${h(t('dataReviewTag'))}</span>`:''}${changeOfUseRisk(r)?`<span class="chip signal-change-use">${state.lang==='it'?'Cambio d’uso · priorità bassa':'Change of use · low priority'}</span>`:''}${constructionRisk(r)?`<span class="chip signal-construction">${state.lang==='it'?'In costruzione · priorità bassa':'Under construction · low priority'}</span>`:''}${markedForFractioning(r)?`<span class="chip signal-split">${h(t('splitTag'))}</span>`:''}${needsRenovation(r)?`<span class="chip signal-renovation">${h(t('renovationTag'))}</span>`:''}${hasFloorPlan(r)?`<span class="chip signal-plan">${h(t('planTag'))}</span>`:''}`;return `<a class="deal" href="${h(link.pathname+link.search)}"><div class="rank">${rank+1}</div><div><div class="deal-top"><div><h3>${h(title(r))}</h3><div class="deal-meta">${signals}<span class="chip area-primary">${h(area(r))}</span>${secondary?`<span class="chip area-secondary">${state.lang==='it'?'Macrozona':'Macro area'}: ${h(secondary)}</span>`:''}<span class="chip">${fmt(size(r))} ${state.lang==='it'?'mq':'sqm'}</span><span class="chip">${eur(price(r))}</span><span class="chip">${priceM2(r)?fmt(priceM2(r))+' '+(state.lang==='it'?'€/mq':'€/sqm'):'—'}</span><span class="chip">${baths(r)??'—'} ${t('bathrooms')}</span><span class="chip">Door ${fmt(doorScore(r))}</span></div></div><div class="deal-score"><b>${mainValue}</b><span>${h(x.c.label)}</span></div></div>${financeCard(r)}</div></a>`}).join('')+(visibleRows.length<rankedRows.length?`<div class="load-more-wrap"><button id="loadMoreDeals" class="load-more" type="button">${state.lang==='it'?'Mostra altri':'Show more'} ${fmt(Math.min(200,rankedRows.length-visibleRows.length))}</button></div>`:''):`<div class="empty">${h(t('empty'))}</div>`;const more=$('loadMoreDeals');if(more)more.onclick=()=>{state.visibleLimit+=200;drawRanking()}}
function drawExplain(){const c=criteria()[state.criterion];const neutral=state.output?.search_strategy==='neutral_fractionability'&&state.criterion==='torium';const description=neutral?(state.lang==='it'?'Usa il Physical Fractionability Score della run neutral: superficie, unità potenziali, bagni, planimetria, ingressi ed esposizione. Prezzo/mq e segnali economici non modificano il ranking.':'Uses the neutral run Physical Fractionability Score: area, potential units, bathrooms, floor plan, entrances and exposure. Price/sqm and economic signals do not affect ranking.'):c.description;const formula=neutral?(state.lang==='it'?'Physical Fractionability Score 0–100. A parità di score non viene applicato alcuno spareggio sul prezzo/mq.':'Physical Fractionability Score 0–100. Equal scores are not broken using price/sqm.'):c.formula;$('criterionExplain').innerHTML=`<h3>${h(c.label)}</h3><p>${h(description)}</p><div class="formula">${h(formula)}</div><p>${h(t('menuNote'))}</p>`}
function applyLanguage(){document.documentElement.lang=state.lang;localStorage.setItem('torium-language',state.lang);setFormatters();$('subtitle').textContent=t('subtitle');$('runSelectLabel').textContent=t('runSelected');$('criterionLabel').textContent=t('sortBy');$('neighborhoodLabel').textContent=t('neighborhood');$('portalLabel').textContent=t('portalPresence');$('rankingTitle').textContent=t('ranking');$('criterionTitle').textContent=t('criterionLogic');$('languageSwitch').textContent=state.lang==='it'?'EN':'IT';$('languageSwitch').setAttribute('aria-label',state.lang==='it'?'Switch to English':'Passa all’italiano');$('criterion').innerHTML=Object.entries(rankingCriteria()).map(([value,item])=>`<option value="${value}">${h(item.label)}</option>`).join('');$('criterion').value=state.criterion;$('newNeutralRun').textContent=state.lang==='it'?'Avvia run seria · Milano':'Start serious run · Milan';$('valueRun').textContent=state.lang==='it'?'Ricalcola valuation & ROI':'Recalculate valuation & ROI';$('refresh').textContent=state.lang==='it'?'Ricarica dati':'Reload data';if(state.outputs.length){const selected=state.outputId;$('runSelect').innerHTML=state.outputs.map(o=>`<option value="${h(o.id)}">${h(outputLabel(o))}</option>`).join('');$('runSelect').value=selected}if(state.output)draw();else $('deals').innerHTML=`<div class="empty">${h(t('loading'))}</div>`}
$('runSelect').onchange=e=>loadRun(e.target.value).catch(err=>$('deals').innerHTML=`<div class="empty">${h(err.message)}</div>`);
$('criterion').onchange=e=>{state.criterion=e.target.value;const url=new URL(location.href);url.searchParams.set('sort',state.criterion);history.replaceState(null,'',url.pathname+url.search);draw()};
$('neighborhoodFilter').onchange=e=>{state.neighborhood=e.target.value;state.visibleLimit=100;syncRunUrl(state.outputId);draw()};
$('portalFilter').onchange=e=>{state.portal=e.target.value;if(state.neighborhood!=='all'&&!neighborhoodRows().some(row=>row.key===state.neighborhood))state.neighborhood='all';state.visibleLimit=100;syncRunUrl(state.outputId);draw()};
$('refresh').onclick=refreshData;
$('newNeutralRun').onclick=startNeutralRun;
$('valueRun').onclick=startValuation;
applyLanguage();
$('languageSwitch').onclick=()=>{state.lang=state.lang==='it'?'en':'it';applyLanguage()};
loadOutputs().catch(err=>$('deals').innerHTML=`<div class="empty">${h(err.message)}</div>`);
</script>
