<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3efe7">
  <title>TORIUM · Imposta password</title>
  <style>
    :root{--bg:#f3efe7;--card:#fffdf8;--ink:#171713;--muted:#716d64;--line:#ded5c6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#dce9d5,transparent 34%),var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}main{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:clamp(26px,6vw,44px);box-shadow:0 28px 80px #2e35231a}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#52704b;font-weight:800}h1{margin:18px 0 9px;font-family:Georgia,serif;font-size:43px;line-height:.95;letter-spacing:-.045em;font-weight:400}p{color:var(--muted);line-height:1.55;margin:0 0 24px}form[hidden]{display:none}label{display:grid;gap:7px;margin-top:14px;font-size:12px;font-weight:700}input{border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px 14px;font:inherit}button{width:100%;margin-top:22px;border:0;border-radius:13px;background:#171713;color:#fff;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.status{min-height:42px;margin-top:14px;color:#38513c;font-size:12px;line-height:1.45}.status.error{color:#9b2d21}.back{display:block;margin-top:18px;color:#38513c;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">TORIUM Investor Club</div>
    <h1>Proteggi l’account.</h1>
    <p>Scegli una password unica di almeno 12 caratteri. Al termine tutte le sessioni attive verranno revocate.</p>
    <form id="passwordForm" hidden>
      <label>Nuova password<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <label>Conferma password<input id="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <button id="submit" type="submit">Salva nuova password</button>
    </form>
    <div id="status" class="status" role="status">Verifica del link sicuro...</div>
    <a class="back" href="/login">Torna all’accesso</a>
  </main>
  <script src="/set-password.js"></script>
</body>
</html>
