<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11130f">
  <title>TORIUM · Imagine</title>
  <style>
    :root{--bg:#10120f;--ink:#f5f1e7;--muted:#aaa99f;--line:#ffffff24;--glass:#171914dc;--sage:#bacbb2;--sand:#dfc9a7;--plan:#a8bed1}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{max-width:1500px;margin:auto;padding:24px 0 90px}.top{position:sticky;top:0;z-index:20;margin:0 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 16px;border:1px solid var(--line);border-radius:17px;background:var(--glass);backdrop-filter:blur(18px)}.brand{text-decoration:none;color:inherit;font-weight:800;letter-spacing:.08em;font-size:13px}.nav{display:flex;gap:8px;align-items:center}.nav a{text-decoration:none;color:var(--muted);font-size:12px;padding:8px 10px;border-radius:999px}.nav a.active{background:#f5f1e7;color:#11130f}.hero{min-height:68vh;padding:9vh 7vw 7vh;display:flex;flex-direction:column;justify-content:flex-end;max-width:1150px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin-bottom:18px}.hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(52px,10vw,130px);line-height:.82;letter-spacing:-.07em;margin:0;max-width:950px}.hero p{max-width:650px;color:#c8c7bf;font-size:clamp(16px,2vw,22px);line-height:1.45;margin:30px 0 0}.filters{display:flex;gap:8px;overflow:auto;padding:0 7vw 30px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:9px 13px;cursor:pointer}.filter.active{background:var(--ink);color:var(--bg)}.feed{display:grid;gap:90px}.project{display:grid;gap:20px}.project-head{padding:0 7vw;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,.7fr);gap:30px;align-items:end}.project h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(34px,6vw,76px);line-height:.95;letter-spacing:-.045em;margin:0}.project-meta{display:grid;gap:10px;color:var(--muted);font-size:13px;line-height:1.5}.style-name{color:var(--sand);text-transform:uppercase;letter-spacing:.12em;font-size:10px}.source{color:var(--ink);text-underline-offset:4px}.rail{display:flex;gap:12px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x proximity;padding:0 7vw 14px;scrollbar-width:thin;scrollbar-color:#ffffff33 transparent}.frame{position:relative;flex:0 0 min(72vw,880px);height:min(58vw,680px);min-height:360px;overflow:hidden;border-radius:3px;background:#252720;scroll-snap-align:center}.frame.portrait{flex-basis:min(42vw,500px)}.frame.plan{flex-basis:min(52vw,650px);background:#ece9e0}.frame.detail{flex-basis:min(35vw,430px)}.frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}.frame.plan img{object-fit:contain}.frame:hover img{transform:scale(1.015)}.asset-tag{position:absolute;top:14px;left:14px;background:#10120fca;border:1px solid #ffffff30;backdrop-filter:blur(8px);padding:7px 9px;border-radius:999px;font-size:9px;letter-spacing:.14em;text-transform:uppercase}.asset-tag.original{color:var(--sage)}.asset-tag.floor_plan{color:var(--plan)}.asset-tag.renewal{color:var(--sand)}.caption{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;gap:20px;align-items:end;color:#fff;text-shadow:0 1px 12px #000;font-size:11px}.story{padding:0 7vw;max-width:850px;color:#c1c0b8;line-height:1.65;font-size:15px}.empty{margin:40px 7vw;padding:80px 24px;border:1px solid var(--line);color:var(--muted);text-align:center}.status{padding:30px 7vw;color:var(--muted)}.viewer{position:fixed;inset:0;z-index:50;background:#050605f2;display:none;place-items:center;padding:20px}.viewer.open{display:grid}.viewer img{max-width:95vw;max-height:90vh;object-fit:contain}.viewer button{position:absolute;right:22px;top:20px;background:#ffffff18;color:#fff;border:1px solid #ffffff44;border-radius:999px;padding:10px 13px;cursor:pointer}@media(max-width:720px){.shell{padding-top:10px}.top{margin:0 10px}.nav a:not(.active){display:none}.hero{min-height:58vh;padding:9vh 20px 5vh}.filters{padding-left:20px}.project-head{padding:0 20px;grid-template-columns:1fr}.rail{padding-left:20px;padding-right:20px}.frame{flex-basis:88vw;height:70vh;min-height:440px}.frame.portrait,.frame.plan,.frame.detail{flex-basis:78vw}.story{padding:0 20px}.feed{gap:65px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <a class="brand" href="/renewals">TORIUM IMAGINE</a>
      <nav class="nav"><a href="/home">Operazioni</a><a href="/villas">Ville</a><a class="active" href="/renewals">Renewals</a></nav>
    </header>
    <section class="hero">
      <div class="eyebrow">Virtual renewal studio</div>
      <h1>See the asset after.</h1>
      <p>Una lettura editoriale delle trasformazioni possibili: render, stato attuale e planimetrie convivono nella stessa sequenza, senza perdere il collegamento con l’annuncio reale.</p>
    </section>
    <section id="filters" class="filters" aria-label="Filtra per stile"></section>
    <section id="feed" class="feed"><div class="status">Caricamento progetti…</div></section>
  </main>
  <div id="viewer" class="viewer" aria-hidden="true"><button type="button" aria-label="Chiudi">Chiudi ✕</button><img alt="Immagine ingrandita"></div>
  <script>
    const state={projects:[],style:'all'};const $=id=>document.getElementById(id);const h=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const labels={renewal:'Renewal',original:'Stato attuale',floor_plan:'Planimetria',material:'Material study',detail:'Dettaglio'};
    function styles(){return [...new Map(state.projects.filter(p=>p.style).map(p=>[p.style.id,p.style])).values()]}
    function drawFilters(){const values=styles();$('filters').innerHTML=[`<button class="filter ${state.style==='all'?'active':''}" data-style="all">Tutti</button>`,...values.map(s=>`<button class="filter ${state.style===s.id?'active':''}" data-style="${h(s.id)}">${h(s.name)}</button>`)].join('')}
    function projectCard(project){const assets=(project.assets||[]).filter(asset=>asset.url);const listing=project.listing||{};const meta=[project.location_label,listing.size_mq?`${listing.size_mq} mq`:null,listing.price_eur?new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(listing.price_eur):null].filter(Boolean).join(' · ');return `<article class="project"><header class="project-head"><div><div class="style-name">${h(project.style?.name||'Renewal study')}</div><h2>${h(project.title||listing.title||'Virtual renewal')}</h2></div><div class="project-meta"><span>${h(project.subtitle||meta)}</span>${project.source_url?`<a class="source" href="${h(project.source_url)}" target="_blank" rel="noopener">Apri annuncio ${h(project.source_channel||'sorgente')} ↗</a>`:''}</div></header>${assets.length?`<div class="rail">${assets.map(asset=>{const kind=asset.asset_kind||'renewal',layout=asset.layout_type==='portrait'?'portrait':asset.layout_type==='plan'||kind==='floor_plan'?'plan':asset.layout_type==='detail'?'detail':'';return `<figure class="frame ${layout}" data-url="${h(asset.url)}"><img src="${h(asset.url)}" loading="lazy" alt="${h(asset.alt_text||asset.caption||labels[kind]||'Renewal')}"><span class="asset-tag ${h(kind)}">${h(labels[kind]||kind)}</span><figcaption class="caption"><span>${h(asset.view_name||asset.room_type||'')}</span><span>${h(asset.caption||'')}</span></figcaption></figure>`}).join('')}</div>`:'<div class="empty">Le immagini di questo progetto sono ancora in elaborazione.</div>'}${project.narrative?`<p class="story">${h(project.narrative)}</p>`:''}</article>`}
    function draw(){drawFilters();const selected=state.projects.filter(project=>state.style==='all'||project.style?.id===state.style);$('feed').innerHTML=selected.length?selected.map(projectCard).join(''):'<div class="empty">Nessun renewal pubblicato per questo filtro.</div>'}
    async function load(){const params=new URLSearchParams(location.search),external=params.get('project');const query=external?`?external_id=${encodeURIComponent(external)}`:'';const response=await fetch('/api/renewals'+query);const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'Impossibile caricare i renewal');state.projects=body.projects||[];draw()}
    $('filters').onclick=event=>{const button=event.target.closest('[data-style]');if(!button)return;state.style=button.dataset.style;draw()};$('feed').onclick=event=>{const frame=event.target.closest('.frame');if(!frame)return;const viewer=$('viewer');viewer.querySelector('img').src=frame.dataset.url;viewer.classList.add('open');viewer.setAttribute('aria-hidden','false')};$('viewer').onclick=()=>{$('viewer').classList.remove('open');$('viewer').setAttribute('aria-hidden','true')};addEventListener('keydown',event=>{if(event.key==='Escape')$('viewer').click()});load().catch(error=>$('feed').innerHTML=`<div class="empty">${h(error.message)}</div>`);
  </script>
</body>
</html>
