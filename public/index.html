function changeSort(mode){const current=state.results[state.i],currentId=current?idOf(current,state.i):null;state.sortMode=sortModes()[mode]?mode:'torium';state.results=orderResults(results(state.out),state.sortMode);const nextIndex=currentId===null?-1:state.results.findIndex((r,i)=>idOf(r,i)===currentId);state.i=nextIndex>=0?nextIndex:0;state.heroPhotoIndex=0;draw();syncPropertyUrl(true)}
function valuationSummary(r){const a=r?.gpt_analysis?.valuation_assumptions||{},s=a.scenario_multipliers||{};if(!r?.gpt_analysis?.valuation_profile_version||r?.gpt_analysis?.valuation_applicability==='not_applicable_no_fractioning')return'';const factors=arr(a.unit_size_multipliers),factor=validNumber(a.unit_size_multiplier)?Number(a.unit_size_multiplier).toFixed(2):factors.length?(state.lang==='it'?'per singola unità':'per individual unit'):'—';return state.lang==='it'?`Exit ${r.gpt_analysis.valuation_profile_version}: benchmark ${fm(a.benchmark_eur_mq)}/mq × fattore taglio ${factor}; superficie vendibile ${fn(validNumber(a.saleable_area_ratio)?Number(a.saleable_area_ratio)*100:null,'%')}; scenari ${fn(validNumber(s.low)?Number(s.low)*100:null,'%')} / ${fn(validNumber(s.base)?Number(s.base)*100:null,'%')} / ${fn(validNumber(s.high)?Number(s.high)*100:null,'%')}.`:`Exit ${r.gpt_analysis.valuation_profile_version}: benchmark ${fm(a.benchmark_eur_mq)}/sqm × size factor ${factor}; saleable area ${fn(validNumber(a.saleable_area_ratio)?Number(a.saleable_area_ratio)*100:null,'%')}; scenarios ${fn(validNumber(s.low)?Number(s.low)*100:null,'%')} / ${fn(validNumber(s.base)?Number(s.base)*100:null,'%')} / ${fn(validNumber(s.high)?Number(s.high)*100:null,'%')}.`}
function renderFinancials(r){const f=financials(r),valuation=valuationSummary(r),a=r?.gpt_analysis||{},notApplicable=a.valuation_applicability==='not_applicable_no_fractioning',rate=validNumber(f.sellingRate)?fn(f.sellingRate*100,'%'):'3%',transformationFormula=state.lang==='it'?`Trasformazione per unità finale: monolocale/bilocale ${fm(f.costPerUnit)}, trilocale ${fm(f.costPerTrilocale)}.`:`Transformation per final unit: studio/one-bedroom ${fm(f.costPerUnit)}, two-bedroom ${fm(f.costPerTrilocale)}.`;const costBoxes=[[t('purchasePrice'),f.purchase],[`${t('purchaseCosts')} (${fn(validNumber(f.rate)?f.rate*100:null,'%')})`,f.purchaseCosts],[`${t('transformation')} (${fn(f.finalUnits)} ${t('finalUnits')})`,f.transformation],[t('projectCost'),f.project]].map(([k,v])=>`<div class="finance-box"><span>${h(k)}</span><b>${fm(v)}</b></div>`).join('');const scenario=(name,exit,selling,total,pl,roi)=>`<div class="scenario"><h4>${h(name)}</h4><div class="scenario-row"><span>${t('exitValue')}</span><b>${fm(exit)}</b></div><div class="scenario-row"><span>${t('brokerage')} (${rate})</span><b>${fm(selling)}</b></div><div class="scenario-row"><span>${t('totalCost')}</span><b>${fm(total)}</b></div><div class="scenario-row"><span>Profit / Loss</span><b>${fm(pl)}</b></div><div class="scenario-row"><span>ROI</span><b>${fn(roi,'%')}</b></div></div>`;const note=notApplicable?t('noFractionRoi'):f.status==='missing_exit_valuation'?t('missingExit'):t('scenariosExisting');const originLabel=state.lang==='it'?'Origine':'Origin',modelLabel=state.lang==='it'?'Modello costi':'Cost model',unregistered=state.lang==='it'?'non registrato':'not recorded';return `<section class="card block finance"><h3>${t('estimatedCosts')}</h3><p class="muted">${f.origin?`${originLabel}: ${h(f.origin)}. `:''}${h(note)} ${modelLabel} ${h(f.version||unregistered)}.${valuation?' '+h(valuation):''}</p><div class="finance-grid">${costBoxes}</div><div class="finance-scenarios">${scenario('Low case',f.low,f.sellingLow,f.totalLow,f.plLow,f.roiLow)}${scenario('Base case',f.base,f.sellingBase,f.totalBase,f.plBase,f.roiBase)}${scenario('High case',f.high,f.sellingHigh,f.totalHigh,f.plHigh,f.roiHigh)}</div><div class="formula" style="margin-top:12px">${h(transformationFormula)} ${t('costFormula')}</div></section>`}
async function loadOutputs(){const r=await fetch('/api/outputs');const d=await r.json();state.outs=d.outputs||[];$('outputs').innerHTML=state.outs.map(o=>`<option value="${h(o.id)}">${h(o.dir+'/'+o.name)}</option>`).join('');if(wantedRun)await loadOutput(normalizeRunId(wantedRun));else if(state.outs[0])await loadOutput(state.outs[0].id)}
async function loadOutput(id){const r=await fetch('/api/output?file='+encodeURIComponent(id)+'&t='+Date.now());const o=await r.json();state.out=o;state.outputId=id;state.results=orderResults(results(o),state.sortMode);state.i=0;state.heroPhotoIndex=0;if(wantedProperty){const k=findPropertyIndex(wantedProperty);if(k>=0)state.i=k;wantedProperty=null}$('outputs').value=id;draw();syncPropertyUrl(true)}
function drawPropertyIdentity(){const r=state.results[state.i],heading=$('main').querySelector('.hero-head h2');if(!r||!heading)return;const address=rawAddress(r),source=idealistaLink(r);if(!address&&!source)return;heading.insertAdjacentHTML('afterend',`<div class="main-nav">${address?`<div class="muted"><b>${t('address')}:</b> ${h(address)}</div>`:''}${source?`<a class="source-link" href="${source}" target="_blank" rel="noopener noreferrer">${t('openIdealista')}</a>`:''}</div>`)}
function propertyNoteTarget(r){const outputId=String(state.outputId||'');const listingIndex=Number(r?.listing_index);if(!outputId.startsWith('supabase:')||!Number.isInteger(listingIndex)||listingIndex<0)return null;return{runId:outputId.replace(/^supabase:/,''),listingIndex}}
function noteTimestamp(value){if(!value)return t('noNote');const date=new Date(value);return Number.isNaN(date.getTime())?(state.lang==='it'?'Nota salvata':'Note saved'):`${t('saved')} ${date.toLocaleString(state.lang==='it'?'it-IT':'en-GB')}`}
function drawPropertyNote(){const r=state.results[state.i],grid=$('main').querySelector('.grid'),target=propertyNoteTarget(r);if(!r||!grid||!target)return;grid.insertAdjacentHTML('afterbegin',`<section class="card block note-editor"><h3>${t('notes')}</h3><textarea id="propertyNote" maxlength="4000" placeholder="${h(t('notePlaceholder'))}"></textarea><div class="note-actions"><button class="primary" id="savePropertyNote">${t('saveNote')}</button><span class="note-status" id="propertyNoteStatus">${t('loadingNote')}</span><span class="note-status" id="propertyNoteCount">0 / 4000</span></div></section>`);const textarea=$('propertyNote'),button=$('savePropertyNote'),status=$('propertyNoteStatus'),count=$('propertyNoteCount'),endpoint=`/api/property-note?run_id=${encodeURIComponent(target.runId)}&listing_index=${target.listingIndex}`;const updateCount=()=>{count.textContent=`${textarea.value.length} / 4000`};textarea.oninput=updateCount;fetch(endpoint,{cache:'no-store'}).then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||(state.lang==='it'?'Caricamento nota fallito':'Note loading failed'));if(!textarea.isConnected)return;textarea.value=data.note||'';updateCount();status.textContent=noteTimestamp(data.updated_at)}).catch(error=>{if(status.isConnected)status.textContent=error.message});button.onclick=async()=>{button.disabled=true;status.textContent=t('saving');try{const response=await fetch('/api/property-note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:target.runId,listing_index:target.listingIndex,note:textarea.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||(state.lang==='it'?'Salvataggio fallito':'Save failed'));textarea.value=data.note||'';updateCount();status.textContent=noteTimestamp(data.updated_at)}catch(error){status.textContent=error.message}finally{button.disabled=false}}}
function applyStaticLanguage(){document.documentElement.lang=state.lang;localStorage.setItem('torium-language',state.lang);$('lightboxClose').textContent=(state.lang==='it'?'Chiudi':'Close')+' ✕';$('lightboxPrev').textContent='← '+t('previous');$('lightboxNext').textContent=t('next')+' →'}
function drawDataQuality(){const r=state.results[state.i];if(!r||dataQuality(r).valid)return;const chips=$('main').querySelector('.hero-head .chips'),grid=$('main').querySelector('.grid');if(chips)chips.insertAdjacentHTML('afterbegin',`<span class="chip signal-data-quality">${t('dataReviewTag')}</span>`);if(grid)grid.insertAdjacentHTML('afterbegin',renderDataQuality(r))}
function draw(){applyStaticLanguage();drawSummary();drawList();drawDetail();drawDataQuality();drawPropertyIdentity();drawPropertyNote()}
function drawSummary(){const o=state.out||{},strategy=o.search_strategy==='neutral_fractionability'?(state.lang==='it'?'Neutral · solo frazionabilità':'Neutral · fractionability only'):o.search_strategy==='legacy_low_price_m2'?(state.lang==='it'?'Legacy · prezzo/mq':'Legacy · price/sqm'):o.search_strategy==='combined_neutral_legacy'?(state.lang==='it'?'Neutral + Legacy · ricalcolata':'Neutral + Legacy · recalculated'):(state.lang==='it'?'Strategia non registrata':'Strategy not recorded');$('summary').innerHTML=`<div class="muted">${h(o.search_name||'triage output')} · ${h(o.city||'')}</div><div class="chips" style="margin:8px 0"><span class="chip">${h(strategy)}</span><span class="chip">${h(o.scoring_mode||(state.lang==='it'?'scoring non registrato':'scoring not recorded'))}</span></div><div class="stats"><div class="stat"><b>${fn(o.scraped_count)}</b><span>${state.lang==='it'?'raccolti':'scraped'}</span></div><div class="stat"><b>${fn(o.eligible_count)}</b><span>${state.lang==='it'?'idonei':'eligible'}</span></div><div class="stat"><b>${fn(o.filtered_out_count)}</b><span>${state.lang==='it'?'filtrati':'filtered'}</span></div><div class="stat"><b>${fn(o.gpt_analyzed_count)}</b><span>GPT</span></div></div>`}
function drawList(){$('list').innerHTML=state.results.map((r,i)=>{const l=listing(r);return `<div class="item ${i===state.i?'active':''}" data-i="${i}"><h3>${i+1}. ${title(r)}</h3><div class="chips">${!dataQuality(r).valid?`<span class="chip signal-data-quality">${t('dataReviewTag')}</span>`:''}<span class="chip">${area(r)}</span><span class="chip">Score ${fn(r.ranking_score??r.score??r.door_engine?.doorScore)}</span><span class="chip">${fm(l.price??r.price_eur??r.price)}</span><span class="chip">${fn(l.size??r.size_mq,state.lang==='it'?' mq':' sqm')}</span><span class="chip">${photos(r).length} ${t('photos')}</span><span class="chip">${plans(r).length} ${t('plans')}</span><span class="chip">${unitPlan(r).length} ${t('units')}</span></div></div>`}).join('');document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{state.i=Number(el.dataset.i);state.heroPhotoIndex=0;draw();syncPropertyUrl()})}
function img(url,cls='',attrs=''){const src=u(url);return src?`<img class="${cls}" src="${src}" loading="lazy" alt="property image" ${attrs}>`:''}
async function share(r,i){const link=buildPropertyUrl(r,i,state.outputId||$('outputs').value,{share:true});const data={title:rawTitle(r),text:redactDescriptionText(rawDesc(r))||t('propertyAnalysis'),url:link.href};try{if(navigator.share){await navigator.share(data);return}}catch(e){}try{await navigator.clipboard.writeText(data.url)}catch(e){}const b=$('share');if(b)b.textContent=t('copied')}
function openLightbox(items,index,title){state.lightboxItems=items.filter(x=>x&&x.url);state.lightboxIndex=index||0;$('lightboxTitle').textContent=title||'Photo';renderLightbox();$('lightbox').classList.add('open');$('lightbox').setAttribute('aria-hidden','false')}
function renderLightbox(){const item=state.lightboxItems[state.lightboxIndex];$('lightboxImg').src=item?.url||'';$('lightboxTitle').textContent=`${state.lightboxIndex+1}/${state.lightboxItems.length} · ${item?.tag||'image'}`}
function moveLightbox(d){if(!state.lightboxItems.length)return;state.lightboxIndex=(state.lightboxIndex+d+state.lightboxItems.length)%state.lightboxItems.length;renderLightbox()}
function closeLightbox(){$('lightbox').classList.remove('open');$('lightbox').setAttribute('aria-hidden','true')}
function setHeroPhoto(index){const r=state.results[state.i],p=photos(r).filter(x=>x?.url);if(!p[index])return;state.heroPhotoIndex=index;const hero=$('heroImg');if(hero)hero.src=p[index].url;document.querySelectorAll('[data-photo-index]').forEach(el=>el.classList.toggle('active',Number(el.dataset.photoIndex)===index))}
function drawDetail(){const r=state.results[state.i];if(!r){$('main').innerHTML=`<div class="empty">${t('noResults')}</div>`;return}const l=listing(r),a=r.gpt_analysis||{},f=financials(r),p=photos(r).filter(x=>x?.url),pl=plans(r).filter(x=>x?.url);if(state.heroPhotoIndex>=p.length)state.heroPhotoIndex=0;const hero=p[state.heroPhotoIndex]?.url||l.thumbnail||r.thumbnail_url,langLabel=state.lang==='it'?'EN':'IT';$('main').innerHTML=`<div class="hero"><div class="hero-head"><div class="main-nav"><button id="home">← ${t('home')}</button><button id="detailLanguage" aria-label="${state.lang==='it'?'Switch to English':'Passa all’italiano'}">${langLabel}</button>${SHARE?'':`<select id="detailSort" aria-label="${state.lang==='it'?'Ordina risultati':'Sort results'}" style="width:auto;margin:0">${sortOptions()}</select>`}</div><div class="muted">${t('result')} ${state.i+1} / ${state.results.length} · ${t('order')}: ${h(sortModes()[state.sortMode])} · ${area(r)}</div><h2>${title(r)}</h2><div class="chips"><span class="chip">${h(a.recommended_action??r.action??'—')}</span><span class="chip">${h(l.status||(state.lang==='it'?'stato —':'condition —'))}</span><span class="chip">${h(l.propertyType||(state.lang==='it'?'tipo —':'type —'))}</span></div>${SHARE?'':`<div class="main-nav"><button id="mainPrev">← ${t('previous')}</button><button id="mainNext" class="primary">${t('next')} →</button><button class="primary" id="share">${t('share')}</button></div>`}</div>${hero?img(hero,'hero-img',`id="heroImg" title="${state.lang==='it'?'Apri a schermo intero':'Open full screen'}"`):''}${p.length?`<div class="gallery">${p.slice(0,18).map((x,i)=>img(x.url,i===state.heroPhotoIndex?'active':'',`data-photo-index="${i}" title="${state.lang==='it'?'Usa come foto principale':'Use as main photo'}"`)).join('')}</div><div class="click-hint">${t('photoHint')}</div>`:''}</div><div class="meta"><div class="metric"><span>${t('price')}</span><b>${fm(l.price??r.price_eur)}</b></div><div class="metric"><span>${t('size')}</span><b>${fn(l.size??r.size_mq,state.lang==='it'?' mq':' sqm')}</b></div><div class="metric"><span>${t('priceSqm')}</span><b>${fm(l.priceByArea??r.price_by_area)}</b></div><div class="metric"><span>${t('physicalScore')}</span><b>${fn(r.ranking_score??r.score??r.door_engine?.doorScore)}</b></div><div class="metric"><span>${t('floor')}</span><b>${h(l.floor??r.floor??'—')}</b></div><div class="metric"><span>${t('bathrooms')}</span><b>${h(l.bathrooms??r.bathrooms??'—')}</b></div><div class="metric"><span>${t('finalUnits')}</span><b>${fn(r.door_engine?.estimatedFinalUnits??r.estimated_final_units)}</b></div><div class="metric"><span>${state.lang==='it'?'ROI base':'Base ROI'}</span><b>${fn(f.roiBase,'%')}</b></div></div><div class="grid">${renderFinancials(r)}${renderUnits(r)}${desc(r)?`<section class="card block"><h3>${t('description')}</h3><p>${desc(r)}</p></section>`:''}${pl.length?`<section class="card block"><h3>${t('floorPlan')}</h3><div class="plans">${pl.map((x,i)=>img(x.url,'',`data-plan-index="${i}"`)).join('')}</div><div class="click-hint">${t('planHint')}</div></section>`:''}${renderArray(t('positive'),a.positive_signals)}${renderArray(t('redFlags'),a.red_flags)}${renderArray(t('missing'),a.missing_information)}${renderArray(t('dueDiligence'),a.human_due_diligence_questions)}</div>`;$('home').onclick=()=>{const url=new URL('/home',location.origin);url.searchParams.set('run',state.outputId);url.searchParams.set('sort',state.sortMode);location.href=url.pathname+url.search};$('detailLanguage').onclick=()=>{state.lang=state.lang==='it'?'en':'it';localStorage.setItem('torium-language',state.lang);document.documentElement.lang=state.lang;setFormatters();draw()};if(!SHARE){$('detailSort').onchange=e=>changeSort(e.target.value);$('mainPrev').onclick=()=>move(-1);$('mainNext').onclick=()=>move(1);$('share').onclick=()=>share(r,state.i)}const heroImg=$('heroImg');if(heroImg)heroImg.onclick=()=>openLightbox(p,state.heroPhotoIndex,state.lang==='it'?'Foto':'Photos');document.querySelectorAll('[data-photo-index]').forEach(el=>el.onclick=()=>setHeroPhoto(Number(el.dataset.photoIndex)));document.querySelectorAll('[data-plan-index]').forEach(el=>el.onclick=()=>openLightbox(pl,Number(el.dataset.planIndex),state.lang==='it'?'Planimetrie':'Floor plans'))}
function move(d){if(!state.results.length)return;state.i=(state.i+d+state.results.length)%state.results.length;state.heroPhotoIndex=0;draw();syncPropertyUrl()}
function boot(){const q=new URLSearchParams(location.search);if(location.pathname==='/'&&q.get('property')){const u=new URL('/property/'+encodeURIComponent(q.get('property')),location.origin);const run=q.get('run')||q.get('run_id');if(run)u.searchParams.set('run',run);if(q.get('sort'))u.searchParams.set('sort',q.get('sort'));history.replaceState(null,'',u.pathname+u.search);wantedProperty=q.get('property');wantedRun=run||wantedRun}return loadOutputs()}
$('outputs').onchange=e=>{wantedProperty=null;loadOutput(e.target.value)};$('refresh').onclick=boot;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('lightboxClose').onclick=closeLightbox;$('lightboxPrev').onclick=()=>moveLightbox(-1);$('lightboxNext').onclick=()=>moveLightbox(1);$('lightbox').onclick=e=>{if(e.target.id==='lightbox')closeLightbox()};addEventListener('popstate',async e=>{if(e.state?.outputId&&e.state.outputId!==state.outputId){await loadOutput(e.state.outputId);if(e.state?.i!=null){state.i=e.state.i;state.heroPhotoIndex=0;draw()}return}const r=parseRoute();const k=findPropertyIndex(r.property);if(k>=0){state.i=k;state.heroPhotoIndex=0;draw()}});addEventListener('keydown',e=>{if($('lightbox').classList.contains('open')){if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')moveLightbox(-1);if(e.key==='ArrowRight')moveLightbox(1);return}if(SHARE)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});boot().catch(e=>$('main').innerHTML='<div class="empty">'+h(e.message)+'</div>');
</script>
